# Tiny Tapeout project information
project:
  title:        "Protocol Emulator ASIC"      # Project title
  author:       "Matthew Cranny"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Programmable protocol emulation for reproducible hardware debugging"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # CMOS5L competition footprint

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_mcranny_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "passthrough input 0"
  ui[1]: "passthrough input 1"
  ui[2]: "passthrough input 2"
  ui[3]: "passthrough input 3"
  ui[4]: "passthrough input 4"
  ui[5]: "passthrough input 5"
  ui[6]: "passthrough input 6"
  ui[7]: "passthrough input 7"

  # Outputs
  uo[0]: "passthrough output 0"
  uo[1]: "passthrough output 1"
  uo[2]: "passthrough output 2"
  uo[3]: "passthrough output 3"
  uo[4]: "passthrough output 4"
  uo[5]: "passthrough output 5"
  uo[6]: "passthrough output 6"
  uo[7]: "passthrough output 7"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
