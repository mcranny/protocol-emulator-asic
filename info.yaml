  ui[6]: ""
  ui[7]: ""
  uo[0]: "host SPI MISO"
  uo[1]: "engine 0 running"
  uo[2]: "engine 1 running"
  uo[3]: "aggregate sticky error"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""
  uio[0]: "protocol pin 0"
  uio[1]: "protocol pin 1"
  uio[2]: "protocol pin 2"
  uio[3]: "protocol pin 3"
