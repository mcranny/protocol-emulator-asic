project:
  title: "Protocol Emulator ASIC"
  author: "Matthew Cranny"
  discord: ""
  description: "Programmable timing engine with SPI host control and UART firmware"
  language: "Verilog"
  clock_hz: 25000000
  tiles: "6x4"
  top_module: "tt_um_mcranny_protocol_emulator"
  source_files:
    - "project.v"
    - "engine.v"
    - "host_spi.v"
pinout:
  ui[0]: "host SPI SCK"
  ui[1]: "host SPI CS_n"
  ui[2]: "host SPI MOSI"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""
  uo[0]: "host SPI MISO"
  uo[1]: "engine running"
  uo[2]: "sticky error"
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""
  uio[0]: "protocol pin 0 / UART TX"
  uio[1]: "protocol pin 1"
  uio[2]: "protocol pin 2"
  uio[3]: "protocol pin 3"
  uio[4]: "protocol pin 4"
  uio[5]: "protocol pin 5"
  uio[6]: "protocol pin 6"
  uio[7]: "protocol pin 7"
yaml_version: 6
