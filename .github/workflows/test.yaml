name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys
          pip install -r test/requirements.txt
      - name: Python specification tests
        run: python -m pytest -q
      - name: RTL lint
        run: verilator --lint-only --Wno-DECLFILENAME --top-module tt_um_mcranny_protocol_emulator src/*.v
      - name: Engine differential simulation
        run: make -C test -f Makefile.core
      - name: Formal safety
        run: make formal
      - name: RTL simulation
        run: make -C test
      - uses: test-summary/action@31493c76ec9e7aa675f1585d3ed6f1da69269a86
        if: always()
        with:
          paths: test/results.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results*.xml
            test/output/*
            build/formal-engine.log
