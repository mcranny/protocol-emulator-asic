name: docs

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install documentation and example dependencies
        run: |
          python -m pip install -r requirements-docs.txt
          python -m pip install -e .
      - name: Build strict Sphinx HTML
        run: python -m sphinx -n -W --keep-going -b html docs build/docs-html
      - name: Retain HTML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: documentation-${{ github.sha }}
          path: |
            build/docs-html
          if-no-files-found: error
      - name: Build TT Markdown datasheet
        uses: TinyTapeout/tt-gds-action/docs@3412659307918422f3f0727917cf9b499aaca588
