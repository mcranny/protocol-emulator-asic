name: V2 stock TT qualification
run-name: "${{ inputs.mode == 'record_local' && 'Record local TT evidence' || 'Qualify stock TT candidate' }} ${{ inputs.candidate_sha }}"
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full candidate SHA; must equal the selected workflow revision
        required: true
        type: string
      mode:
        description: Qualify stock TT inputs or record already validated local timeout-fallback evidence
        required: true
        type: choice
        default: qualify
        options: [qualify, record_local]
      report_json:
        description: Reviewed local evidence summary; required only in record_local mode
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: v2-physical
  cancel-in-progress: false
env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  LIBRELANE_IMAGE_OVERRIDE: ghcr.io/librelane/librelane@sha256:d109140b8f17fc54f4fca998beb8124f4949404ec52e339eebd2250854a18b5a
jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Require an exact eligible candidate and a recognized operation
        env:
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_REF" == refs/heads/v2-current || "$GITHUB_REF" == refs/heads/main ]]
          case "$MODE" in qualify|record_local) ;; *) exit 1 ;; esac
  functional:
    needs: candidate
    if: inputs.mode == 'qualify'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Verify candidate and approval configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/tt-ci
          gh api "repos/$GITHUB_REPOSITORY/environments/v2-physical" > build/tt-ci/environment.json
          gh api "repos/$GITHUB_REPOSITORY/environments/v2-physical/deployment-branch-policies" > build/tt-ci/branches.json
          python -m tools.tt_qualification guard
      - name: Install functional tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys
          pip install -r test/requirements.txt
      - name: Complete clean-source functional gate
        run: |
          python tools/validate_local.py --require-clean --output build/tt-functional
          python -m tools.tt_qualification functional --directory build/tt-functional
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v2-tt-functional
          path: build/tt-functional
          if-no-files-found: error
  gds:
    needs: functional
    environment: v2-physical
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Verify candidate and approval configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/tt-ci
          gh api "repos/$GITHUB_REPOSITORY/environments/v2-physical" > build/tt-ci/environment.json
          gh api "repos/$GITHUB_REPOSITORY/environments/v2-physical/deployment-branch-policies" > build/tt-ci/branches.json
          python -m tools.tt_qualification guard
      - name: Record isolated V2 input preparation
        run: python -m tools.tt_qualification prepare
      - name: Stock CMOS5L flow from RTL
        uses: TinyTapeout/tt-gds-action@3412659307918422f3f0727917cf9b499aaca588
        with:
          pdk: ihp-sg13cmos5l
          tools-ref: f6bf5c587fba4a4a8abd4c0a03234fccfbf6e61e
          librelane-version: 3.1.0.dev3
      - name: Independently measure final netlist mapping
        run: |
          docker run --name "tt-mapping-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --network none \
            -v "$PWD:/work" -v "$PDK_ROOT:/pdk:ro" -w /work "$LIBRELANE_IMAGE_OVERRIDE" \
            python tools/v2_mapped_audit.py \
            /work/tt_submission/tt_um_mcranny_protocol_emulator_v2.v \
            /work/build/tt-ci/mapping.json
      - name: Bind physical outputs to original and prepared inputs
        run: python -m tools.tt_qualification physical
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v2-tt-physical
          path: build/tt-ci
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure() || cancelled()
        with:
          name: v2-tt-failed-flow
          path: |
            runs/wokwi
            src/config_merged.json
          if-no-files-found: warn
  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Verify candidate and approval configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/tt-ci
          gh api "repos/$GITHUB_REPOSITORY/environments/v2-physical" > build/tt-ci/environment.json
          gh api "repos/$GITHUB_REPOSITORY/environments/v2-physical/deployment-branch-policies" > build/tt-ci/branches.json
          python -m tools.tt_qualification guard
      - uses: TinyTapeout/tt-gds-action/precheck@3412659307918422f3f0727917cf9b499aaca588
        with:
          tools-ref: f6bf5c587fba4a4a8abd4c0a03234fccfbf6e61e
      - name: Verify all required prechecks and layout identity
        run: python -m tools.tt_qualification precheck
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v2-tt-precheck
          path: build/tt-ci
          if-no-files-found: error
  gatelevel:
    needs: gds
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Verify candidate and approval configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/tt-ci
          gh api "repos/$GITHUB_REPOSITORY/environments/v2-physical" > build/tt-ci/environment.json
          gh api "repos/$GITHUB_REPOSITORY/environments/v2-physical/deployment-branch-policies" > build/tt-ci/branches.json
          python -m tools.tt_qualification guard
      - uses: TinyTapeout/tt-gds-action/gl_test@3412659307918422f3f0727917cf9b499aaca588
        with:
          test-dir: test/tt
      - name: Verify the complete V2 pin suite and netlist identity
        run: python -m tools.tt_qualification gatelevel
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v2-tt-gatelevel
          path: build/tt-ci
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v2-tt-gatelevel-diagnostics
          path: test/output
          if-no-files-found: warn
  acceptance:
    needs: [functional, gds, precheck, gatelevel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: v2-tt-functional
          path: build/qualification/functional
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: v2-tt-physical
          path: build/qualification/physical
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: v2-tt-precheck
          path: build/qualification/precheck
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: v2-tt-gatelevel
          path: build/qualification/gatelevel
      - name: Apply unchanged physical requirements and complete functional checks
        run: python -m tools.tt_qualification accept --directory build/qualification
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v2-tt-qualification
          path: build/qualification
          if-no-files-found: error
  record_local:
    needs: candidate
    if: inputs.mode == 'record_local'
    uses: ./.github/workflows/tt-local-report.yaml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      report_json: ${{ inputs.report_json }}
