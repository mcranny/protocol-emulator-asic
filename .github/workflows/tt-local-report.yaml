name: Record locally validated TT evidence
on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Full SHA matching this workflow revision and the timed-out run
        type: string
        required: true
      report_json:
        description: Reviewed local evidence summary, checksums, and artifact location
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  record:
    environment: v2-physical
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      REPORT_JSON: ${{ inputs.report_json }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Verify candidate and approval configuration
        run: |
          mkdir -p build/tt-ci
          gh api "repos/$GITHUB_REPOSITORY/environments/v2-physical" > build/tt-ci/environment.json
          gh api "repos/$GITHUB_REPOSITORY/environments/v2-physical/deployment-branch-policies" > build/tt-ci/branches.json
          python -m tools.tt_qualification guard
      - name: Read report and original timeout evidence
        run: |
          python -c 'import json, os, pathlib; pathlib.Path("build/tt-ci/local-summary.json").write_text(json.dumps(json.loads(os.environ["REPORT_JSON"])))'
          RUN_ID=$(python -c 'import json; x=json.load(open("build/tt-ci/local-summary.json"))["timed_out_run_id"]; assert type(x) is int and x > 0; print(x)')
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > build/tt-ci/original-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > build/tt-ci/original-jobs.json
      - name: Record local validation without claiming a CI rerun
        run: |
          python -m tools.tt_local_report \
            --summary build/tt-ci/local-summary.json \
            --original build/tt-ci/original-run.json \
            --jobs build/tt-ci/original-jobs.json \
            --output build/tt-ci/recorded-local-evidence.json
          echo 'Local TT evidence recorded. This job checked report fields and the hosted timeout; it did not rerun the local physical checks.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v2-local-tt-report
          path: build/tt-ci
          if-no-files-found: error
