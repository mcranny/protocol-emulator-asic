name: V2 candidate
on: [push, workflow_dispatch, workflow_call]
jobs:
  v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys
          pip install -r test/requirements.txt
      - name: Python regressions
        run: python -m pytest -q --junitxml=build/python-results.xml
      - name: V2 lint and synthesis
        run: |
          verilator --lint-only --Wno-DECLFILENAME --top-module tt_um_mcranny_protocol_emulator_v2 src/*.v
          yosys -Q -T -p 'read_verilog src/*.v; synth -top tt_um_mcranny_protocol_emulator_v2; stat'
      - name: V2 differential and pin simulation
        run: |
          make -C test -f Makefile.v2
          make -C test -f Makefile.v2pins
      - name: V2 formal and capture
        run: |
          make v2-formal
          make v2-capture-test
      - name: Mutation sensitivity
        run: python tools/v2_mutations.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v2-test-results
          path: |
            build/python-results.xml
            build/formal-v2-*.log
            build/v2-mutations/
            test/results_v2*.xml
            test/output/
