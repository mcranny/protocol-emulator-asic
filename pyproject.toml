[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-emulator"
version = "1.0.0"
description = "Tools for the programmable protocol emulator ASIC"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
hardware = ["spidev==3.8"]

[project.scripts]
protocol-emulator = "protocol_emulator.cli:main"

[tool.setuptools.packages.find]
where = ["host"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["host"]
